name: TaskProof checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TASKPROOF_REQUIRE_HTTP: '1'
      TASKPROOF_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/engine.mjs
          node --check src/server.mjs
          node --check public/app.js
      - name: Engine and HTTP tests (no loopback skip allowed)
        run: npm test
      - name: Evidence-level pilot expectations (no human time-savings claim)
        run: node src/pilot.mjs
      - name: Live read-only GitHub check (own PR only)
        run: node test/github-live.mjs
        env:
          TASKPROOF_GITHUB_TOKEN: ${{ github.token }}
      - name: Prepare trusted runner image
        run: docker pull node:22-bookworm-slim
      - name: Isolated runner acceptance checks
        run: node test/runner-live.mjs
        env:
          TASKPROOF_CANARY: non-secret-inheritance-probe
      - name: Install fixed browser test tooling
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install Chromium
        # ubuntu-24.04 runners already ship browsers and shared libraries.
        # Fetch the pinned Playwright browser without repeating apt font downloads.
        # Browser acceptance tests below still fail if a required library is absent.
        run: npx playwright install chromium
      - name: Browser acceptance checks
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taskproof-ui-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
