name: Gemini metadata access check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Single metadata GET (no generation)
        run: node src/gemini-access.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
